{% extends "base.html" %}

{% block title %}Sign In - PocketSmart AI{% endblock %}

{% block content %}
<div class="container" style="padding: 60px 24px; min-height: 70vh; display: flex; align-items: center; justify-content: center;">
  <div class="glass-panel" style="width: 100%; max-width: 440px; padding: 40px; position: relative;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="logo-icon" style="width:48px; height:48px; margin: 0 auto 16px; font-size:1.5rem;">⚡</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 6px;">Welcome Back</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to access your saved budget blueprints</p>
    </div>

    {% if error %}
      <div style="padding: 12px 16px; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); border-radius: var(--radius-md); color: #fb7185; font-size: 0.88rem; margin-bottom: 20px;">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/login" style="display: flex; flex-direction: column; gap: 18px;">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. thanga or user@domain.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Sign In to PocketSmart</button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-glass); font-size: 0.88rem; color: var(--text-secondary);">
      Don't have an account yet? <a href="/register" style="color: var(--primary); font-weight: 600;">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
