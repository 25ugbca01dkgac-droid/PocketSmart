{% extends "base.html" %}

{% block title %}Create Account - PocketSmart AI{% endblock %}

{% block content %}
<div class="container" style="padding: 60px 24px; min-height: 70vh; display: flex; align-items: center; justify-content: center;">
  <div class="glass-panel" style="width: 100%; max-width: 460px; padding: 40px; position: relative;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="logo-icon" style="width:48px; height:48px; margin: 0 auto 16px; font-size:1.5rem;">⚡</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 6px;">Create Your Account</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Join PocketSmart AI to personalize recommendations</p>
    </div>

    {% if error %}
      <div style="padding: 12px 16px; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); border-radius: var(--radius-md); color: #fb7185; font-size: 0.88rem; margin-bottom: 20px;">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/register" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="form-group">
        <label for="username">Username *</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. thanga_pandi" required minlength="3">
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="thanga@example.com" required>
      </div>

      <div class="form-group">
        <label for="full_name">Full Name (Optional)</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Thanga Pandi">
      </div>

      <div class="form-group">
        <label for="password">Password (min 6 characters) *</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Create Account</button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-glass); font-size: 0.88rem; color: var(--text-secondary);">
      Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
